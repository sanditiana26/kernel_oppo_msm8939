name: Build Oppo A37f Kernel with RKSU Legacy (3.0.0-30)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

    - name: Setup RKSU 3.0.0 & All 3.10 Backports
      run: |
          GH="https://github.com"
          git clone --depth=1 -b v3.0.0-30-legacy "${GH}/sanditiana26/RKSU.git" KernelSU || git clone --depth=1 -b new_upstream "${GH}/sanditiana26/RKSU.git" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu/Kconfig" drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i 's/depends on OVERLAY_FS/depends on EXT4_FS/g' KernelSU/kernel/Kconfig
          sed -i 's/depends on KPROBES/depends on EXT4_FS/g' KernelSU/kernel/Kconfig
          sed -i 's/default n/default y/g' KernelSU/kernel/Kconfig

          # 1. Buat header kompatibilitas global 3.10 (groups_sort, ktime, atomic, proc_ops, uaccess, dll)
          cat << 'EOF' > KernelSU/kernel/ksu_compat_310.h
          #ifndef __KSU_COMPAT_310_H
          #define __KSU_COMPAT_310_H

          #include <linux/version.h>
          #include <linux/types.h>
          #include <linux/cred.h>
          #include <linux/sort.h>
          #include <linux/slab.h>
          #include <linux/uaccess.h>
          #include <linux/fs.h>
          #include <linux/proc_fs.h>
          #include <linux/seccomp.h>
          #include <linux/sched.h>
          #include <linux/ktime.h>

          #ifndef NGROUPS_PER_BLOCK
          #define NGROUPS_PER_BLOCK ((int)(PAGE_SIZE / sizeof(kgid_t)))
          #endif

          static inline int ksu_gid_cmp(const void *a, const void *b)
          {
          	kgid_t gid_a = *(const kgid_t *)a;
          	kgid_t gid_b = *(const kgid_t *)b;
          	return gid_gt(gid_a, gid_b) - gid_lt(gid_a, gid_b);
          }

          static inline void ksu_groups_sort(struct group_info *group_info)
          {
          	int base = 0, n = group_info->ngroups;
          	while (base < n) {
          		int left = min(n - base, NGROUPS_PER_BLOCK);
          		sort(group_info->blocks[base / NGROUPS_PER_BLOCK], left, sizeof(kgid_t), ksu_gid_cmp, NULL);
          		base += NGROUPS_PER_BLOCK;
          	}
          }
          #define groups_sort ksu_groups_sort

          #ifndef ktime_get_boottime_ns
          static inline u64 ksu_ktime_get_boottime_ns(void)
          {
          	struct timespec ts;
          	get_monotonic_boottime(&ts);
          	return timespec_to_ns(&ts);
          }
          #define ktime_get_boottime_ns ksu_ktime_get_boottime_ns
          #endif

          #ifndef ktime_get_coarse_boottime_ns
          #define ktime_get_coarse_boottime_ns ktime_get_boottime_ns
          #endif

          #ifndef atomic_fetch_add_relaxed
          #define atomic_fetch_add_relaxed(i, v) (atomic_add_return((i), (v)) - (i))
          #endif

          #ifndef __user
          #define __user
          #endif

          #ifndef kvzalloc
          #define kvzalloc(size, flags) kzalloc(size, flags)
          #endif

          #ifndef kvfree
          #define kvfree(addr) kfree(addr)
          #endif

          #ifndef strscpy
          #define strscpy(dst, src, size) strlcpy(dst, src, size)
          #endif

          #endif
          EOF

          # 2. Hapus header kernel baru yang tidak ada di 3.10 & suntikkan ksu_compat_310.h
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e '/#include <linux\/lsm_hooks.h>/d' \
            -e '/#include <linux\/set_memory.h>/d' \
            -e '/#include <linux\/pgtable.h>/d' \
            -e 's/#include <linux\/sched\/signal.h>/#include <linux\/sched.h>/g' \
            -e 's/#include <linux\/sched\/task.h>/#include <linux\/sched.h>/g' \
            -e 's/#include <linux\/sched\/mm.h>/#include <linux\/sched.h>/g' \
            -e 's/#include <linux\/sched\/user.h>/#include <linux\/sched.h>/g' {} +

          find KernelSU/kernel -type f -name "*.c" -exec sed -i '1i #include "ksu_compat_310.h"' {} +

          # 3. Fix SELinux 3.10 (selinux_state -> variabel global 3.10)
          find KernelSU/kernel/selinux -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e 's/selinux_state\.enforcing/selinux_enforcing/g' \
            -e 's/&selinux_state\.ss->policydb/&policydb/g' \
            -e 's/selinux_state\.ss->policydb/policydb/g' \
            -e 's/&selinux_state\.ss->policy_rwlock/&policy_rwlock/g' \
            -e 's/selinux_state\.ss->policy_rwlock/policy_rwlock/g' \
            -e 's/selinux_state\.initialized/ss_initialized/g' {} +

          # 4. Fix ksud.c (read_iter -> read + dummy stub ksu_handle_vfs_read agar fs/read_write.c tidak error linking)
          python3 << 'EOF'
          import glob

          for path in glob.glob("KernelSU/kernel/**/ksud.c", recursive=True):
              with open(path, "r") as f:
                  c = f.read()
              c = c.replace("(*orig_read_iter)(struct kiocb *, struct iov_iter *)", "(*orig_read)(struct file *, char __user *, size_t, loff_t *)")
              c = c.replace("read_iter_proxy(struct kiocb *iocb, struct iov_iter *to)", "ksu_read_proxy(struct file *file, char __user *buf, size_t count, loff_t *pos)")
              if "ksu_handle_vfs_read" not in c:
                  c += "\nint ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos) { return 0; }\n"
              with open(path, "w") as f:
                  f.write(c)
          EOF

          # 5. Fix sys_reboot hook & 32-bit compat pointer di kernel/sys.c
          python3 << 'EOF'
          import re

          with open("kernel/sys.c", "r") as f:
              content = f.read()

          inc_hdr = '#include <linux/compat.h>\n#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n'
          reboot_decl = "SYSCALL_DEFINE4(reboot,"
          content = content.replace(reboot_decl, inc_hdr + reboot_decl, 1)

          hook_reboot = """#ifdef CONFIG_KSU
          	{
          		void __user *ksu_arg = is_compat_task() ? compat_ptr((unsigned long)arg) : arg;
          		ksu_handle_sys_reboot(magic1, magic2, cmd, &ksu_arg);
          	}
          #endif"""

          m_reboot = re.search(r'SYSCALL_DEFINE4\(reboot,[^\)]+\)\s*\{', content)
          if m_reboot:
              content = content[:m_reboot.end()] + "\n" + hook_reboot + "\n" + content[m_reboot.end():]

          with open("kernel/sys.c", "w") as f:
              f.write(content)
          EOF

          # 6. Fix seccomp & task->seccomp di 3.10 + matikan seluruh -Werror GCC 4.9
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e 's/spin_lock_irq(&current->sighand->siglock);/spin_lock_irq(\&current->sighand->siglock);/g' \
            -e 's/struct proc_ops/struct file_operations/g' \
            -e 's/\.proc_open/\.open/g' \
            -e 's/\.proc_read/\.read/g' \
            -e 's/\.proc_write/\.write/g' \
            -e 's/\.proc_lseek/\.llseek/g' \
            -e 's/\.proc_release/\.release/g' \
            -e 's/\.proc_ioctl/\.unlocked_ioctl/g' \
            -e 's/\.proc_compat_ioctl/\.compat_ioctl/g' {} +

          find KernelSU/kernel -name "Makefile*" -exec sed -i \
            -e 's/-Wno-gcc-compat//g' \
            -e 's/-Wno-int-conversion//g' \
            -e 's/-Werror=implicit-function-declaration/-Wno-implicit-function-declaration/g' \
            -e 's/-Werror//g' {} +
          find KernelSU/kernel -name "Makefile*" -exec sh -c 'echo "ccflags-y += -Wno-error -Wno-implicit-function-declaration -Wno-return-type -Wno-declaration-after-statement -I\$(srctree)/drivers/kernelsu" >> "$1"' _ {} \;

          # 7. Konfigurasi Defconfig Oppo A37f
          sed -i '/CONFIG_LOCALVERSION=/d' arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_LOCALVERSION="-Sanditiana26"' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_OVERLAY_FS=y' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_KSU_MANUAL_HOOK=y' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_KPROBES=n' >> arch/arm64/configs/lineageos_a37f_defconfig

    - name: Clone Toolchains (GCC 4.9)
      run: |
          GH="https://github.com"
          mkdir -p $HOME/android/TOOLS/GCC
          git clone --depth=1 "${GH}/KudProject/aarch64-linux-android-4.9.git" $HOME/android/TOOLS/GCC/los-4.9-64
          git clone --depth=1 -b lineage-17.1 "${GH}/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" $HOME/android/TOOLS/GCC/los-4.9-32

    - name: Run build.sh
      env:
          KBUILD_BUILD_USER: sanditiana26
          KBUILD_BUILD_HOST: oppo-a37f
          KCFLAGS: "-Wno-error"
      run: |
         chmod +x build.sh
         ./build.sh

    - name: Verify KSU Config & Linking
      run: |
          echo "=== Cek .config ==="
          grep "CONFIG_KSU" out/.config || echo "CONFIG_KSU NOT FOUND!"
          echo "=== Cek Symbol KernelSU di vmlinux ==="
          nm out/vmlinux | grep "ksu_" | head -n 20 || echo "KSU SYMBOLS NOT LINKED INTO VMLINUX!"

    - name: Upload KernelSU ZIP
      uses: actions/upload-artifact@v4
      with:
          name: A37F-RKSU-3.0.0-30
          path: out/A37F_KERNEL_ASU_*.zip
