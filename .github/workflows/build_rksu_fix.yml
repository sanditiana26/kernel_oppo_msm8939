name: Build Oppo A37f Kernel with RKSU Legacy (True Universal v5 final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

      - name: Setup RKSU & Custom Kernel Version
        run: |
          GH="https://github.com"
          git clone --depth=1 -b v1.0.5-83-legacy "${GH}/rsuntk/KernelSU.git" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu/Kconfig" drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i 's/depends on OVERLAY_FS/depends on EXT4_FS/g' KernelSU/kernel/Kconfig
          sed -i 's/depends on KPROBES/depends on EXT4_FS/g' KernelSU/kernel/Kconfig
          sed -i 's/default n/default y/g' KernelSU/kernel/Kconfig

          # 1. Hapus lsm_hooks.h & perbaiki inisialisasi core_hook.c
          sed -i '/#include <linux\/lsm_hooks.h>/d' KernelSU/kernel/*.c KernelSU/kernel/*.h
          sed -i '693,$d' KernelSU/kernel/core_hook.c
          cat << 'EOF' >> KernelSU/kernel/core_hook.c
          void __init ksu_lsm_hook_init(void) {}
          void __init ksu_core_init(void)
          {
          	pr_info("KernelSU: ksu_core_init started successfully!\n");
          	ksu_lsm_hook_init();
          	ksu_allowlist_init();
          	ksu_throne_tracker_init();
          	ksu_sucompat_init();
          }
          void ksu_core_exit(void)
          {
          	ksu_allowlist_exit();
          	ksu_throne_tracker_exit();
          	ksu_sucompat_exit();
          }
          EOF

          # 1b. Pastikan ksu.c mencetak log dmesg saat boot
          sed -i 's/ksu_core_init();/pr_info("KernelSU: kernelsu_init triggered!\\n"); ksu_core_init();/g' KernelSU/kernel/ksu.c

          # 1c. Hook prctl di security_task_prctl (Basis v5 final + fix 32-bit compat CMD_SET_APP_PROFILE)
          python3 -c '
          with open("kernel/sys.c", "r") as f:
              content = f.read()

          hook_code = """if ((u32)option == 0xdeadbeef) {
          		extern int ksu_handle_prctl(int option, unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5);
          		extern void escape_to_root(void);
          		u32 ksu_ver = 12340;
          		u32 ksu_ok = 0xdeadbeef;
          		u32 cmd = (u32)arg2;
          		void __user *p3 = is_compat_task() ? compat_ptr((u32)arg3) : (void __user *)arg3;
          		void __user *p4 = is_compat_task() ? compat_ptr((u32)arg4) : (void __user *)arg4;
          		void __user *p5 = is_compat_task() ? compat_ptr((u32)arg5) : (void __user *)arg5;
          		pr_info("KernelSU: prctl hit! cmd=%u uid=%u compat=%d\\n", cmd, from_kuid(&init_user_ns, current_uid()), is_compat_task());
          		if (cmd == 1 || cmd == 2) {
          			if (p3 && copy_to_user(p3, &ksu_ver, sizeof(ksu_ver)))
          				pr_warn("KernelSU: copy ver failed\\n");
          			if (p5 && copy_to_user(p5, &ksu_ok, sizeof(ksu_ok)))
          				pr_warn("KernelSU: copy magic failed\\n");
          			return 0;
          		}
          		if (cmd == 0) {
          			ksu_handle_prctl((int)(u32)option, 0, (unsigned long)p3, (unsigned long)p4, (unsigned long)p5);
          			escape_to_root();
          			if (p5 && copy_to_user(p5, &ksu_ok, sizeof(ksu_ok)))
          				pr_warn("KernelSU: copy magic cmd0 failed\\n");
          			return 0;
          		}
          		return ksu_handle_prctl((int)(u32)option, (unsigned long)cmd, (unsigned long)p3, (unsigned long)p4, (unsigned long)p5);
          	}
          	error = security_task_prctl(option, arg2, arg3, arg4, arg5);"""

          target = "error = security_task_prctl(option, arg2, arg3, arg4, arg5);"
          assert target in content, "Target security_task_prctl not found in kernel/sys.c"
          assert "0xdeadbeef" not in content, "Hook 0xdeadbeef sudah ada di kernel/sys.c!"
          content = content.replace(target, hook_code, 1)

          with open("kernel/sys.c", "w") as f:
              f.write(content)
          print("Sukses memasang hook hybrid v5+compat di kernel/sys.c!")
          '
          # 1d. Patch core_hook.c untuk 32-bit compat App Profile & Manager UID
          python3 << 'EOF'
          import re
          # Pastikan CMD_IS_SU_ENABLED selalu mengembalikan true ke RKSU Manager
          code, su_en_hits = re.subn(
              r"copy_to_user\s*\(\s*([^,]+)\s*,\s*&ksu_su_compat_enabled\s*,\s*sizeof\s*\([^)]+\)\s*\)",
              r'({ bool __su_on = true; pr_info("KernelSU: CMD_IS_SU_ENABLED -> true\\n"); copy_to_user(\1, &__su_on, sizeof(__su_on)); })',
              code
          )
          print(f"Total CMD_IS_SU_ENABLED dipatch: {su_en_hits}")

          with open("KernelSU/kernel/core_hook.c", "r") as f:
              code = f.read()

          code = code.replace("#include <linux/slab.h>", "#include <linux/slab.h>\n#include <linux/compat.h>", 1)
          code = code.replace("u32 version = KERNEL_SU_VERSION;", "u32 version = 12340;")
          code = code.replace("if (magic2 != CHANGE_MANAGER_UID)", "if ((u32)magic2 != CHANGE_MANAGER_UID)")
          code = code.replace("if (arg2 == EVENT_POST_FS_DATA)", "if ((u32)arg2 == EVENT_POST_FS_DATA)")
          code = code.replace("if (arg2 == EVENT_BOOT_COMPLETED)", "if ((u32)arg2 == EVENT_BOOT_COMPLETED)")
          code = code.replace("if (arg2 == EVENT_MODULE_MOUNTED)", "if ((u32)arg2 == EVENT_MODULE_MOUNTED)")

          code, mgr_hits = re.subn(
              r"if\s*\(\s*!is_manager\s*\(\s*\)\s*\)",
              "if (!is_manager() && from_kuid(&init_user_ns, current_uid()) >= 10000) { ksu_set_manager_uid(from_kuid(&init_user_ns, current_uid())); } if (!is_manager())",
              code
          )
          print(f"Total pengecekan is_manager() dipatch: {mgr_hits}")
          # Suntikkan registrasi manager UID langsung di dalam ksu_handle_prctl
          hook_mgr_entry = """
          	{
          		uid_t __cuid = from_kuid(&init_user_ns, current_uid());
          		if (__cuid >= 10000 && (u32)arg2 != 0 && (u32)arg2 != 1 && (u32)arg2 != 2) {
          			if (ksu_get_manager_uid() != __cuid) {
          				ksu_set_manager_uid(__cuid);
          				pr_info("KernelSU: manager UID bound to %u (cmd=%lu)\\n", __cuid, arg2);
          			}
          		}
          	}
          """
          target_fn = "int ksu_handle_prctl(int option, unsigned long arg2, unsigned long arg3,"
          assert target_fn in code, "Fungsi ksu_handle_prctl tidak ditemukan di core_hook.c!"

          # Sisipkan tepat setelah kurung kurawal pembuka '{' milik ksu_handle_prctl
          fn_pos = code.find(target_fn)
          brace_pos = code.find("{", fn_pos)
          assert brace_pos != -1, "Kurung kurawal pembuka ksu_handle_prctl tidak ditemukan!"
          code = code[:brace_pos + 1] + hook_mgr_entry + code[brace_pos + 1:]
          print("Sukses menyuntikkan auto-bind manager UID di awal ksu_handle_prctl!")


          compat_helpers = """
          #ifdef CONFIG_COMPAT
          struct compat_root_profile {
          	int32_t uid;
          	int32_t gid;
          	int32_t groups_count;
          	int32_t groups[KSU_MAX_GROUPS];
          	struct {
          		uint64_t effective;
          		uint64_t permitted;
          		uint64_t inheritable;
          	} __attribute__((packed)) capabilities;
          	char selinux_domain[KSU_SELINUX_DOMAIN];
          	int32_t namespaces;
          } __attribute__((packed));

          struct compat_non_root_profile {
          	bool umount_modules;
          } __attribute__((packed));

          struct compat_app_profile {
          	uint32_t version;
          	char key[KSU_MAX_PACKAGE_NAME];
          	int32_t current_uid;
          	bool allow_su;
          	union {
          		struct {
          			bool use_default;
          			char template_name[KSU_MAX_PACKAGE_NAME];
          			struct compat_root_profile profile;
          		} __attribute__((packed)) rp_config;
          		struct {
          			bool use_default;
          			struct compat_non_root_profile profile;
          		} __attribute__((packed)) nrp_config;
          	} __attribute__((packed));
          } __attribute__((packed));

          static void compat_to_app_profile(const struct compat_app_profile *cprof, struct app_profile *prof)
          {
          	memset(prof, 0, sizeof(*prof));
          	prof->version = cprof->version;
          	memcpy(prof->key, cprof->key, sizeof(prof->key));
          	prof->current_uid = cprof->current_uid;
          	prof->allow_su = cprof->allow_su;
          	if (cprof->allow_su) {
          		prof->rp_config.use_default = cprof->rp_config.use_default;
          		memcpy(prof->rp_config.template_name, cprof->rp_config.template_name, sizeof(prof->rp_config.template_name));
          		prof->rp_config.profile.uid = cprof->rp_config.profile.uid;
          		prof->rp_config.profile.gid = cprof->rp_config.profile.gid;
          		prof->rp_config.profile.groups_count = cprof->rp_config.profile.groups_count;
          		memcpy(prof->rp_config.profile.groups, cprof->rp_config.profile.groups, sizeof(prof->rp_config.profile.groups));
          		prof->rp_config.profile.capabilities.effective = cprof->rp_config.profile.capabilities.effective;
          		prof->rp_config.profile.capabilities.permitted = cprof->rp_config.profile.capabilities.permitted;
          		prof->rp_config.profile.capabilities.inheritable = cprof->rp_config.profile.capabilities.inheritable;
          		memcpy(prof->rp_config.profile.selinux_domain, cprof->rp_config.profile.selinux_domain, sizeof(prof->rp_config.profile.selinux_domain));
          		prof->rp_config.profile.namespaces = cprof->rp_config.profile.namespaces;
          	} else {
          		prof->nrp_config.use_default = cprof->nrp_config.use_default;
          		prof->nrp_config.profile.umount_modules = cprof->nrp_config.profile.umount_modules;
          	}
          }

          static void app_profile_to_compat(const struct app_profile *prof, struct compat_app_profile *cprof)
          {
          	memset(cprof, 0, sizeof(*cprof));
          	cprof->version = prof->version;
          	memcpy(cprof->key, prof->key, sizeof(cprof->key));
          	cprof->current_uid = prof->current_uid;
          	cprof->allow_su = prof->allow_su;
          	if (prof->allow_su) {
          		cprof->rp_config.use_default = prof->rp_config.use_default;
          		memcpy(cprof->rp_config.template_name, prof->rp_config.template_name, sizeof(cprof->rp_config.template_name));
          		cprof->rp_config.profile.uid = prof->rp_config.profile.uid;
          		cprof->rp_config.profile.gid = prof->rp_config.profile.gid;
          		cprof->rp_config.profile.groups_count = prof->rp_config.profile.groups_count;
          		memcpy(cprof->rp_config.profile.groups, prof->rp_config.profile.groups, sizeof(cprof->rp_config.profile.groups));
          		cprof->rp_config.profile.capabilities.effective = prof->rp_config.profile.capabilities.effective;
          		cprof->rp_config.profile.capabilities.permitted = prof->rp_config.profile.capabilities.permitted;
          		cprof->rp_config.profile.capabilities.inheritable = prof->rp_config.profile.capabilities.inheritable;
          		memcpy(cprof->rp_config.profile.selinux_domain, prof->rp_config.profile.selinux_domain, sizeof(cprof->rp_config.profile.selinux_domain));
          		cprof->rp_config.profile.namespaces = prof->rp_config.profile.namespaces;
          	} else {
          		cprof->nrp_config.use_default = prof->nrp_config.use_default;
          		cprof->nrp_config.profile.umount_modules = prof->nrp_config.profile.umount_modules;
          	}
          }
          #endif
          """

          code = code.replace("int ksu_handle_prctl(", compat_helpers + "\nint ksu_handle_prctl(", 1)

          def repl_copy_from(m):
              src_ptr = m.group(1)
              return f"""({{
          		int __err = 0;
          #ifdef CONFIG_COMPAT
          		if (is_compat_task()) {{
          			struct compat_app_profile __cprof;
          			__err = copy_from_user(&__cprof, {src_ptr}, sizeof(__cprof));
          			if (!__err)
          				compat_to_app_profile(&__cprof, &profile);
          		}} else
          #endif
          		{{
          			__err = copy_from_user(&profile, {src_ptr}, sizeof(profile));
          		}}
          		pr_info("KernelSU: copy_from_user profile err=%d key=%s uid=%d allow=%d\\n", __err, profile.key, profile.current_uid, profile.allow_su);
          		__err;
          	}})"""

          code, count_from = re.subn(
              r"copy_from_user\s*\(\s*&profile\s*,\s*([^,]+)\s*,\s*sizeof\s*\([^)]+\)\s*\)",
              repl_copy_from,
              code
          )

          def repl_copy_to(m):
              dst_ptr = m.group(1)
              return f"""({{
          		int __err = 0;
          #ifdef CONFIG_COMPAT
          		if (is_compat_task()) {{
          			struct compat_app_profile __cprof;
          			app_profile_to_compat(&profile, &__cprof);
          			__err = copy_to_user({dst_ptr}, &__cprof, sizeof(__cprof));
          		}} else
          #endif
          		{{
          			__err = copy_to_user({dst_ptr}, &profile, sizeof(profile));
          		}}
          		pr_info("KernelSU: copy_to_user profile err=%d key=%s\\n", __err, profile.key);
          		__err;
          	}})"""

          code, count_to = re.subn(
              r"copy_to_user\s*\(\s*([^,]+)\s*,\s*&profile\s*,\s*sizeof\s*\([^)]+\)\s*\)",
              repl_copy_to,
              code
          )

          print(f"DEBUG PATCH: count_from={count_from}, count_to={count_to}")
          for line in code.splitlines():
              if "profile" in line and ("copy_" in line or "CMD_" in line):
                  print("LINE:", line.strip())
          assert count_from >= 1 and count_to >= 1, "Gagal patch copy_from_user / copy_to_user pada profile!"

          with open("KernelSU/kernel/core_hook.c", "w") as f:
              f.write(code)
          EOF
          sed -i 's/static bool ksu_su_compat_enabled = true;/static bool ksu_su_compat_enabled = true;\n#define ksu_su_compat_enabled true/g' KernelSU/kernel/sucompat.c

          # 1e. Aktifkan guard #ifdef CONFIG_KSU di semua file hook
          for hookfile in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c kernel/sys.c; do
            if [ -f "$hookfile" ]; then
              sed -i 's/#ifdef CONFIG_KSU_MANUAL_HOOK/#ifdef CONFIG_KSU/g' "$hookfile"
            fi
          done
          
          # 1f. Daftarkan syscall 384 (getrandom) & tambahkan sys_renameat2 (syscall 391) di ARM 32-bit compat
          python3 -c '
          import re

          with open("fs/namei.c", "r") as f:
              namei = f.read()

          if "sys_renameat2" not in namei:
              renameat2_code = """
          SYSCALL_DEFINE5(renameat2, int, olddfd, const char __user *, oldname,
          		int, newdfd, const char __user *, newname, unsigned int, flags)
          {
          	if (flags != 0)
          		return -EINVAL;
          	return sys_renameat(olddfd, oldname, newdfd, newname);
          }
          """
              target_fn = "SYSCALL_DEFINE4(renameat"
              assert target_fn in namei, "SYSCALL_DEFINE4(renameat) tidak ditemukan di fs/namei.c"
              namei = namei.replace(target_fn, renameat2_code + "\n" + target_fn, 1)
              with open("fs/namei.c", "w") as f:
                  f.write(namei)

          with open("include/linux/syscalls.h", "r") as f:
              syscalls_h = f.read()

          if "sys_renameat2" not in syscalls_h:
              decl = "asmlinkage long sys_renameat2(int olddfd, const char __user *oldname, int newdfd, const char __user *newname, unsigned int flags);\n"
              syscalls_h = syscalls_h.replace("#endif", decl + "#endif", 1)
              with open("include/linux/syscalls.h", "w") as f:
                  f.write(syscalls_h)

          with open("arch/arm64/include/asm/unistd32.h", "r") as f:
              unistd32 = f.read()

          if "__NR_getrandom" not in unistd32:
              unistd32 = re.sub(
                  r"#define __NR_syscalls\s+\d+",
                  "#define __NR_getrandom 384\n__SYSCALL(__NR_getrandom, sys_getrandom)\n#define __NR_syscalls 385",
                  unistd32,
                  count=1
              )

          if "__NR_renameat2" not in unistd32:
              unistd32 = re.sub(
                  r"#define __NR_syscalls\s+\d+",
                  "#define __NR_renameat2 391\n__SYSCALL(__NR_renameat2, sys_renameat2)\n#define __NR_syscalls 392",
                  unistd32,
                  count=1
              )

          with open("arch/arm64/include/asm/unistd32.h", "w") as f:
              f.write(unistd32)
          print("Sukses mendaftarkan syscall 384 & 391!")
          '


          # 2. Fix error 'request for member val' pada Kernel 3.10
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e 's/current_uid()\.val/current_uid()/g' \
            -e 's/current_euid()\.val/current_euid()/g' \
            -e 's/uid\.val/uid/g' \
            -e 's/gid\.val/gid/g' {} +

          # 3. Fix kompatibilitas Kernel 3.10 pada folder selinux/
          find KernelSU/kernel/selinux -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e 's/selinux_state\.enforcing/selinux_enforcing/g' \
            -e 's/&selinux_state\.ss->policydb/&policydb/g' \
            -e 's/selinux_state\.ss->policydb/policydb/g' \
            -e 's/&selinux_state\.ss->policy_rwlock/&policy_rwlock/g' \
            -e 's/selinux_state\.ss->policy_rwlock/policy_rwlock/g' {} +

          # 4. Fix read_iter menjadi read pada ksud.c untuk Kernel 3.10
          sed -i 's/(\*orig_read_iter)(struct kiocb \*, struct iov_iter \*)/(\*orig_read)(struct file \*, char __user \*, size_t, loff_t \*)/g' KernelSU/kernel/ksud.c
          sed -i 's/read_iter_proxy(struct kiocb \*iocb, struct iov_iter \*to)/ksu_read_proxy(struct file \*file, char __user \*buf, size_t count, loff_t \*pos)/g' KernelSU/kernel/ksud.c
          sed -i 's/read_iter_proxy/ksu_read_proxy/g' KernelSU/kernel/ksud.c
          sed -i 's/struct file \*file = iocb->ki_filp;/\/\/ patched for 3.10/g' KernelSU/kernel/ksud.c
          sed -i 's/iocb->ki_pos == 0/\*pos == 0/g' KernelSU/kernel/ksud.c
          sed -i 's/orig_read_iter(iocb, to)/orig_read(file, buf, count, pos)/g' KernelSU/kernel/ksud.c
          sed -i 's/if (orig_read_iter)/if (orig_read)/g' KernelSU/kernel/ksud.c
          sed -i 's/orig_read_iter = file->f_op->read_iter;/orig_read = file->f_op->read;/g' KernelSU/kernel/ksud.c
          sed -i 's/fops_proxy.read_iter = .*/fops_proxy.read = ksu_read_proxy;/g' KernelSU/kernel/ksud.c

          # 5. Tambahkan fungsi pembantu Kernel 3.10
          cat << 'EOF' >> KernelSU/kernel/kernel_compat.c
          #include <linux/sort.h>
          #include <linux/dcache.h>
          #include <linux/fs.h>
          void ext4_unregister_sysfs(struct super_block *sb) {}
          #if LINUX_VERSION_CODE < KERNEL_VERSION(3, 18, 0)
          char *bin2hex(char *dst, const void *src, size_t count)
          {
          	const unsigned char *_src = src;
          	while (count--)
          		dst = hex_byte_pack(dst, *_src++);
          	return dst;
          }
          ssize_t strscpy(char *dest, const char *src, size_t count)
          {
          	long res = 0;
          	if (count == 0)
          		return -E2BIG;
          	while (count) {
          		char c = src[res];
          		dest[res] = c;
          		if (!c)
          			return res;
          		res++;
          		count--;
          	}
          	if (res)
          		dest[res - 1] = '\0';
          	return -E2BIG;
          }
          static int gid_cmp(const void *_a, const void *_b)
          {
          	kgid_t a = *(kgid_t *)_a;
          	kgid_t b = *(kgid_t *)_b;
          	return gid_gt(a, b) - gid_lt(a, b);
          }
          void groups_sort(struct group_info *group_info)
          {
          	int nblocks, i;
          	int count = group_info->ngroups;
          	if (!count)
          		return;
          	nblocks = group_info->nblocks;
          	for (i = 0; i < nblocks; i++) {
          		int cp_count = min(NGROUPS_PER_BLOCK, count);
          		sort(group_info->blocks[i], cp_count, sizeof(kgid_t), gid_cmp, NULL);
          		count -= NGROUPS_PER_BLOCK;
          	}
          }
          bool d_is_reg(const struct dentry *dentry)
          {
          	return dentry && dentry->d_inode && S_ISREG(dentry->d_inode->i_mode);
          }
          #endif
          EOF

          # 6. Menyesuaikan Makefile KernelSU agar lolos GCC 4.9
          sed -i 's/-Wno-gcc-compat//g' KernelSU/kernel/Makefile
          sed -i 's/-Wno-int-conversion//g' KernelSU/kernel/Makefile
          echo 'ccflags-y += -Wno-error -Wno-return-type -Wno-declaration-after-statement' >> KernelSU/kernel/Makefile

          # 7. Konfigurasi Defconfig Oppo A37f
          sed -i '/CONFIG_LOCALVERSION=/d' arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_LOCALVERSION="-Sanditiana26"' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_OVERLAY_FS=y' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_KSU_MANUAL_HOOK=y' >> arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_KPROBES=n' >> arch/arm64/configs/lineageos_a37f_defconfig

      - name: Clone Toolchains (GCC 4.9)
        run: |
          GH="https://github.com"
          mkdir -p $HOME/android/TOOLS/GCC
          git clone --depth=1 "${GH}/KudProject/aarch64-linux-android-4.9.git" $HOME/android/TOOLS/GCC/los-4.9-64
          git clone --depth=1 -b lineage-17.1 "${GH}/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" $HOME/android/TOOLS/GCC/los-4.9-32

      - name: Run build.sh
        env:
          KBUILD_BUILD_USER: sanditiana26
          KBUILD_BUILD_HOST: oppo-a37f
          KCFLAGS: "-Wno-error"
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify KSU Config & Linking
        run: |
          echo "=== Cek .config ==="
          grep "CONFIG_KSU" out/.config || echo "CONFIG_KSU NOT FOUND!"
          echo "=== Cek Symbol KernelSU di vmlinux ==="
          nm out/vmlinux | grep "ksu_" | head -n 20 || echo "KSU SYMBOLS NOT LINKED INTO VMLINUX!"

      - name: Upload KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A37F-RKSU-True-Universal-v3
          path: out/A37F_KERNEL_ASU_*.zip
