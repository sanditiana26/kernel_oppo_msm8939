name: Build Oppo A37f KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop python3 unzip zip


      - name: Set Custom Kernel Version & Host
        run: |
          sed -i '/CONFIG_LOCALVERSION=/d' arch/arm64/configs/lineageos_a37f_defconfig
          echo 'CONFIG_LOCALVERSION="-Sanditiana26"' >> arch/arm64/configs/lineageos_a37f_defconfig
          export KBUILD_BUILD_USER="sanditiana26"
          export KBUILD_BUILD_HOST="github"

      - name: Clone Toolchains (GCC 4.9)
        run: |
          mkdir -p $HOME/android/TOOLS/GCC
           git clone --depth=1 https://github.com/KudProject/aarch64-linux-android-4.9 $HOME/android/TOOLS/GCC/los-4.9-64
           git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 $HOME/android/TOOLS/GCC/los-4.9-32

      - name: Run build.sh
        env:
          KBUILD_BUILD_USER: sanditiana26
          KBUILD_BUILD_HOST: oppo-a37f
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A37F-KernelSU-Flashable
          path: out/A37F_KERNEL_*.zip
